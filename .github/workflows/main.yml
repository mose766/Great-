name: MT5-RDP

on:
  workflow_dispatch:

jobs:
  mt5-runner:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = "MT5Runner@2026"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install MT5
        shell: powershell
        run: |
          $file = "$env:TEMP\mt5.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $file

          Start-Process $file -ArgumentList "/auto" -Wait

      - name: Install Tailscale (MATCHING YOUR STYLE)
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=mt5-vps-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install MT5 Login Config
        shell: powershell
        run: |
          @"
          [Common]
          Login=${{ secrets.MT5_LOGIN }}
          Password=${{ secrets.MT5_PASSWORD }}
          Server=${{ secrets.MT5_SERVER }}
          "@ | Out-File "C:\MT5Login.ini"

      - name: Launch MT5
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files (x86)\MetaTrader 5\terminal64.exe"
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Start-Process $p -ArgumentList "/config:C:\MT5Login.ini"
              break
            }
          }

      - name: Verify RDP via Tailscale IP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port not reachable"
            exit 1
          }

          Write-Host "RDP CONNECTION OK"

      - name: FINAL ACCESS OUTPUT
        shell: powershell
        run: |
          Write-Host "=================================="
          Write-Host "MT5 VPS READY"
          Write-Host "=================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USER: RDP"
          Write-Host "PASS: $env:RDP_PASS"
          Write-Host "=================================="
          Write-Host "ADMIN PANEL:"
          Write-Host "https://login.tailscale.com/admin/machines"
          Write-Host "=================================="

      - name: Keep Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
          }
